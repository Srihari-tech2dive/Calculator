<!DOCTYPE html>
<html>
<head>
    <title>Colorful Math Calculators (No Backend)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(125deg, #35baf6 10%, #eef2f3 130%); min-height: 100vh; margin:0; color: #222; }
        h1, nav { background: #0557a8; color: #fff; padding: 24px 0 8px 0; margin: 0; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 0px 10px rgba(0,0,0,0.11);}
        nav a {display: inline-block; margin: 0 18px; text-decoration: none; font-weight: bold; color: #fff; font-size: 16px; background: #1fa2ff; padding: 8px 18px; border-radius:20px;}
        nav a:hover {background: #fff; color: #0557a8; }
        .container {margin: 38px auto; max-width: 600px;}
        .calc-group {border-radius: 16px; background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%); box-shadow: 0 4px 20px rgba(41,81,183,0.14); padding: 24px 36px 30px 36px; margin-bottom: 30px; display:none;}
        h2 {color:#1b396a;margin:0 0 18px 0;}
        label {font-weight: bold; margin-top: 12px; display: block;}
        input, textarea {width:96%;padding:7px 8px;margin-bottom:16px;margin-top:3px; font-size:16px;border-radius:7px;border:1px solid #dadada;background:#f2f8fe;}
        button {background:#0575e6;color:#fff;font-weight:bold;border:none;margin:9px 0 16px 0;padding:9px 27px;border-radius:10px;box-shadow:0 2px 8px #1fa2ff55;cursor:pointer;font-size:15px;}
        button:hover{background:#6dd5ed;color:#0557a8;}
        .result {color:#074; background:#e6fffa;border-radius:8px;padding:10px 16px;margin-top:8px;font-size:15px;box-shadow:0 1px 8px #b3e1ee55;}
        @media (max-width:700px){.container{padding:0 4%;}
        .calc-group{padding:15px 7px 24px 7px;}input,textarea{width:99%;}}
    </style>
</head>
<body>
<h1>Colorful Math Calculators</h1>
<nav>
  <a href="#" onclick="showCalc('linear');return false;">Linear Dependence</a>
  <a href="#" onclick="showCalc('diag');return false;">Diagonalization</a>
  <a href="#" onclick="showCalc('gauss');return false;">Gauss Jordan</a>
  <a href="#" onclick="showCalc('newton');return false;">Newton Interpolation</a>
  <a href="#" onclick="showCalc('euler');return false;">Euler's Method</a>
</nav>
<div class="container">
<!-- Linear Dependence -->
<div id="linear" class="calc-group"><h2>Linear Dependence</h2>
    <form onsubmit="linearDependence();return false;">
        <label>Vectors (one per line, space-separated):</label>
        <textarea id="lin_vec" rows="4"></textarea>
        <button type="submit">Check</button>
    </form>
    <div id="lin_result" class="result"></div>
</div>
<!-- Diagonalization -->
<div id="diag" class="calc-group"><h2>Diagonalization</h2>
    <form onsubmit="diagonalization();return false;">
        <label>Matrix rows (one per line, space-separated):</label>
        <textarea id="diag_matrix" rows="4"></textarea>
        <button type="submit">Diagonalize</button>
    </form>
    <div id="diag_result" class="result"></div>
</div>
<!-- Gauss-Jordan -->
<div id="gauss" class="calc-group"><h2>Gauss-Jordan Method</h2>
    <form onsubmit="gaussJordan();return false;">
        <label>Augmented matrix (rows, last value is constant):</label>
        <textarea id="gauss_matrix" rows="4"></textarea>
        <button type="submit">Solve</button>
    </form>
    <div id="gauss_result" class="result"></div>
</div>
<!-- Newton's Interpolation -->
<div id="newton" class="calc-group"><h2>Newton's Interpolation</h2>
    <form onsubmit="newtonInterpolation();return false;">
        <label>x values (space-separated):</label><input type="text" id="newton_x">
        <label>y values (space-separated):</label><input type="text" id="newton_y">
        <label>Value to interpolate:</label><input type="text" id="newton_val">
        <button type="submit">Calculate</button>
    </form>
    <div id="newton_result" class="result"></div>
</div>
<!-- Euler's Method -->
<div id="euler" class="calc-group"><h2>Euler's Method</h2>
    <form onsubmit="eulerMethod();return false;">
        <label>dy/dt expression (use 't' and 'y', e.g. t*y+1):</label><input type="text" id="euler_expr">
        <label>Initial t:</label><input type="text" id="euler_t0">
        <label>Final t:</label><input type="text" id="euler_tN">
        <label>Step size:</label><input type="text" id="euler_h">
        <label>Initial y:</label><input type="text" id="euler_y0">
        <button type="submit">Solve</button>
    </form>
    <div id="euler_result" class="result"></div>
</div>
</div>
<script>
function showCalc(id) {
    document.querySelectorAll('.calc-group').forEach(e=>e.style.display='none');
    document.getElementById(id).style.display='block';
    window.scrollTo({ top: 120, behavior: 'smooth' });
}
showCalc('linear');

// --- Linear Dependence ---
function linearDependence() {
    let rows = document.getElementById('lin_vec').value.trim().split('\n').map(r=>r.split(' ').map(Number));
    if (rows.some(v=>v.some(isNaN))) { document.getElementById('lin_result').innerText="Invalid input."; return; }
    let matrix = rows[0].map((x,i)=>rows.map(r=>r[i]));
    let rank = numericMatrixRank(matrix);
    let result = rank < rows.length ? "Vectors are <b style='color:#f00'>linearly dependent</b>." : "Vectors are <b style='color:#09b'>linearly independent</b>.";
    document.getElementById('lin_result').innerHTML = result;
}
function numericMatrixRank(m) {
    m = m.map(r=>r.slice());
    let n = m.length, mlen = m[0].length, rank = 0;
    for (let col=0; col < mlen; col++) {
        let pivot = -1;
        for (let row=rank; row < n; row++) if (Math.abs(m[row][col]) > 1e-8) { pivot=row; break; }
        if (pivot==-1) continue;
        [m[rank], m[pivot]]=[m[pivot], m[rank]];
        let div = m[rank][col];
        for (let j=col;j<mlen;j++) m[rank][j]/=div;
        for (let i=0;i<n;i++)
            if (i!=rank) for (let j=mlen-1;j>=col;j--) m[i][j]-=m[i][col]*m[rank][j];
        rank++;
    }
    return rank;
}

// --- Diagonalization ---
function diagonalization() {
    let rows = document.getElementById('diag_matrix').value.trim().split('\n').map(r=>r.split(' ').map(Number));
    if (rows.some(v=>v.some(isNaN))) { document.getElementById('diag_result').innerText="Invalid input."; return; }
    let n = rows.length;
    if (rows.some(r=>r.length!=n)) { document.getElementById('diag_result').innerText="Matrix must be square."; return; }
    let ev = numericEigen(rows);
    document.getElementById('diag_result').innerHTML = 'Eigenvalues: <span style="color:#e11">'+ev.values.join(', ')+'</span><br>Eigenvectors:<br>'+ev.vectors.map(v=>v.join(', ')).join('<br>');
}
function numericEigen(mat) {
    if (mat.length===2 && mat[0].length===2) {
        let a=mat[0][0], b=mat[0][1], c=mat[1][0], d=mat[1][1];
        let T = a+d, D=a*d-b*c;
        let disc = Math.sqrt(T*T-4*D);
        let l1 = (T+disc)/2, l2=(T-disc)/2;
        return {values:[l1.toFixed(3),l2.toFixed(3)], vectors:[[1,(l1-a)/b],[1,(l2-a)/b]]};
    }
    return {values:["Demo: Only 2x2 supported"], vectors:[["N/A"]]};
}

// --- Gauss-Jordan ---
function gaussJordan() {
    let mat = document.getElementById('gauss_matrix').value.trim().split('\n').map(r=>r.split(' ').map(Number));
    let n = mat.length;
    for(let i=0;i<n;i++) if(mat[i].length!=n+1) { document.getElementById('gauss_result').innerText="Input error: n+1 numbers per row."; return;}
    for(let i=0;i<n;i++) {
        let maxRow = i;
        for (let k=i+1;k<n;k++) if (Math.abs(mat[k][i])>Math.abs(mat[maxRow][i])) maxRow=k;
        [mat[i],mat[maxRow]]=[mat[maxRow],mat[i]];
        let div = mat[i][i];
        for (let j=i;j<=n;j++) mat[i][j]/=div;
        for (let k=0;k<n;k++) {
            if (k!=i) {
                let f = mat[k][i];
                for (let j=i;j<=n;j++) mat[k][j]-=f*mat[i][j];
            }
        }
    }
    let output = mat.map((row,i)=>`<span style="color:#11e;">x${i+1} = ${row[n].toFixed(4)}</span>`).join('<br>');
    document.getElementById('gauss_result').innerHTML = output;
}

// --- Newton Interpolation ---
function newtonInterpolation() {
    let x = document.getElementById('newton_x').value.split(' ').map(Number);
    let y = document.getElementById('newton_y').value.split(' ').map(Number);
    let value = Number(document.getElementById('newton_val').value);
    if (x.length!=y.length || x.some(isNaN)||y.some(isNaN)||isNaN(value)) { document.getElementById('newton_result').innerText="Invalid input."; return; }
    let n = x.length, f = Array(n).fill().map((_,i)=>[y[i]]);
    for(let j=1;j<n;j++)
        for(let i=0;i<n-j;i++) f[i][j]=(f[i+1][j-1]-f[i][j-1])/(x[i+j]-x[i]);
    let u=1, sum=f[0][0], ux=(value-x[0]);
    for(let i=1;i<n;i++) {
        u*=ux;
        ux*=(value-x[i]);
        sum+=f[0][i]*u;
    }
    document.getElementById('newton_result').innerHTML = "<span style='color:#f92772;'>Interpolated value (forward): " +sum.toFixed(6)+"</span>";
}

// --- Euler's Method ---
function eulerMethod() {
    let expr = document.getElementById('euler_expr').value;
    let t0 = parseFloat(document.getElementById('euler_t0').value);
    let tN = parseFloat(document.getElementById('euler_tN').value);
    let h = parseFloat(document.getElementById('euler_h').value);
    let y0 = parseFloat(document.getElementById('euler_y0').value);
    if ([t0,tN,h,y0].some(isNaN)) { document.getElementById('euler_result').innerText="Invalid input."; return; }
    let f = Function('t','y','return '+expr+';');
    let tArr=[],yArr=[],n=Math.round((tN-t0)/h);
    tArr[0]=t0; yArr[0]=y0;
    for(let i=1;i<=n;i++) {
        tArr[i]=tArr[i-1]+h;
        yArr[i]=yArr[i-1]+h*f(tArr[i-1],yArr[i-1]);
    }
    document.getElementById('euler_result').innerHTML='<span style="color:#db5195;">y values:</span><br>'+yArr.map((y,i)=>`<b>t=${tArr[i].toFixed(3)}</b>&nbsp; <span style="color:#09b;">y=${y.toFixed(6)}</span>`).join('<br>');
}
</script>
</body>
</html>
